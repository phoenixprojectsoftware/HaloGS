// Commands to place CTF/Domination entities in a map
// See ctf/README.txt and dom/README.txt for more info
alias ctf_add_blue_flag "addctfitem item_flag_team1;echo Blue flag created"
alias ctf_add_blue_spawn "addctfitem info_player_team1;echo Blue spawn created"
alias ctf_add_red_flag "addctfitem item_flag_team2;echo Red flag created"
alias ctf_add_red_spawn "addctfitem info_player_team2;echo Red spawn created"
alias dom_add_flag "adddomitem item_dom_controlpoint;echo Control point created"

// HUD Controls
alias hudon "hud_draw 1; crosshair 1; r_drawviewmodel 1; alias togglehud hudoff"
alias hudoff "hud_draw 0; crosshair 0; r_drawviewmodel 0; alias togglehud hudon"
alias togglehud "hudoff"