// Commands to place CTF/Domination entities in a map
// See ctf/README.txt and dom/README.txt for more info
alias addblueflag "addctfitem item_flag_team1;echo CTF Blue Flag created"
alias addbluespawn "addctfitem info_player_team1;echo Blue Team Spawn created"
alias addredflag "addctfitem item_flag_team2;echo CTF Red Flag created"
alias addredspawn "addctfitem info_player_team2;echo Red Team Spawn created"
alias adddomflag "adddomitem item_dom_controlpoint;echo Domination Control Point created"

// HUD Controls
alias hudon "hud_draw 1; crosshair 1; r_drawviewmodel 1; alias togglehud hudoff"
alias hudoff "hud_draw 0; crosshair 0; r_drawviewmodel 0; alias togglehud hudon"
alias togglehud "hudoff"